#!/usr/bin/env bash
# Shared policy: sourced by PATH wrappers and hooks.
#
# Wrappers use a two-tier model:
#   1. Read-only commands (listed below) — always pass through
#   2. Everything else — requires CLAUDE_APPROVED=1 env var, which is
#      set by terminator.sh and consumed (unset) on first use so
#      subprocesses can't chain multiple writes unsupervised

# --- Git ---
# Read-only commands (always allowed)
GIT_ALLOWED_READONLY=(
	status log diff show blame shortlog describe
	branch remote tag stash
	ls-files ls-tree rev-parse rev-list
	name-rev reflog grep log
	config count-objects fsck
	cat-file for-each-ref
	fetch
)


# --- Terraform ---
# Subcommands that cannot change infrastructure or remote state. Allowed with or
# without an AWS profile — the ones that do need credentials fail with AWS's own
# error, which says more than a blanket refusal from the wrapper. `fmt` rewrites
# local .tf files; that is governed by the sandbox write zones, not this gate.
TERRAFORM_ALLOWED_READONLY=(
	console fmt get graph init metadata modules
	output plan providers query show validate version
)
# Subcommands whose read and write forms share a name. Only these second words
# are read-only; anything else falls through to the CLAUDE_APPROVED gate.
TERRAFORM_READONLY_ACTIONS=(
	"state list" "state show" "state pull"
	"workspace list" "workspace show"
)

# --- Always blocked binaries ---
ALWAYS_BLOCKED=(rm dd)

# --- SSH ---
# Block commands that enable remote writes (push over SSH)
SSH_BLOCKED_COMMANDS=(git-receive-pack)
