#!/usr/bin/env bash
# Shared policy: sourced by the terraform PATH wrapper.
#
# Terraform is the one place where a subcommand's read and write forms share a
# name, so the split has to be enumerated by hand. Everything else that used to
# live here left with the wrapper it served:
#
#   git read-only list   the git wrapper is gone. Its CLAUDE_APPROVED gate was
#                        open at the top level anyway: terminator.sh exported
#                        the flag into every tool call, so a nested
#                        `make deploy -> git push` saw it set exactly as a
#                        direct call did. `git push` is now a permissions.ask
#                        rule, which matches inside chains and subshells.
#   rm and dd blocks     permissions.ask, plus Claude Code's own protection for
#                        rm against critical paths, which no allow rule can
#                        override and which catches unresolved variables.
#   ssh receive-pack     unreachable. Plain ssh ignores the sandbox's proxy
#                        variables, so it cannot open a connection at all.

# --- Terraform ---
# Subcommands that cannot change infrastructure or remote state. Allowed with or
# without an AWS profile — the ones that do need credentials fail with AWS's own
# error, which says more than a blanket refusal from the wrapper. `fmt` rewrites
# local .tf files; that is governed by the sandbox write zones, not this gate.
TERRAFORM_ALLOWED_READONLY=(
	console fmt get graph init metadata modules
	output plan providers query show validate version
)
# Subcommands whose read and write forms share a name. Only these second words
# are read-only; anything else falls through to the credential gate.
TERRAFORM_READONLY_ACTIONS=(
	"state list" "state show" "state pull"
	"workspace list" "workspace show"
)
